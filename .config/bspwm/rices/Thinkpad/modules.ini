[module/date]
type = internal/date

interval = 1.0

date = %d %b
time = %H:%M
format-foreground = ${color.fg}
date-alt = " %a, %d %b %Y"

format = <label>
label = "%{A1:OpenApps --calendar:}%date%, %time%%{A}"

######################################################

[module/filesystem]
type = internal/fs

mount-0 = /

interval = 60
fixed-values = false

format-mounted = <label-mounted>
format-mounted-prefix = ""
format-mounted-prefix-padding = 3pt
format-mounted-prefix-foreground = ${color.mauve}
label-mounted = "%used%"

format-unmounted = <label-unmounted>
format-unmounted-prefix = ""
format-unmounted-prefix-padding = 3pt
label-unmounted = %mountpoint%: not mounted

######################################################

[module/network]
type = internal/network
interface = ${system.sys_network_interface}

interval = 3.0
accumulate-stats = true
unknown-as-up = true

format-connected = <label-connected>
format-connected-prefix = ""
format-connected-prefix-padding = 3pt
format-connected-foreground = ${color.fg}
format-connected-prefix-foreground = ${color.sapphire}

speed-unit = ""
label-connected = "%{A1:OpenApps --netmanager:}%netspeed%%{A}"
label-connected-foreground = ${color.yellow}

format-disconnected = <label-disconnected>
format-disconnected-prefix = ""
format-disconnected-prefix-padding = 3pt
format-disconnected-foreground = ${color.red}

label-disconnected = "%{A1:OpenApps --netmanager:}Offline%{A}"
label-disconnected-foreground = ${color.red}

######################################################

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = true
interval = 5

#format-volume = <label-volume>
#format-volume-prefix = ""
#format-volume-prefix-padding = 3pt
#format-volume-foreground = ${color.blue}

label-volume = "%percentage%"
label-volume-foreground = ${color.fg}

#format-muted = <label-muted>
#format-muted-prefix = ""
#format-muted-prefix-padding = 3pt
#format-muted-foreground = ${color.blue}
label-muted = "Muted"
label-muted-foreground = ${color.red}

click-left = Volume --toggle
click-right = OpenApps --soundcontrol
click-middle = pulseaudio-control next-node

######################################################

[module/pulseaudio-control-output]
type = custom/script
tail = true
#label-padding-right = 3pt

exec = pulseaudio-control --color-muted '89b4fa' --node-nicknames-from "device.description" --node-nickname "alsa_output.pci-0000_05_00.6.analog-stereo/analog-output-headphones:" --node-nickname "alsa_output.pci-0000_05_00.6.analog-stereo/analog-output-speaker:" --node-nickname "bluez_output.*:󰂰 " --node-nickname "*:" --format '$([ $IS_MUTED = "yes" ] && echo  %{F#f38ba8}Muted%{F-} || echo %{F#89b4fa}$NODE_NICKNAME%{F-} $VOL_LEVEL)' listen
click-right = OpenApps --soundcontrol
click-left = Volume --toggle
#--node-blacklist "alsa_output.pci-0000_01_00.1.hdmi-stereo-extra2"
click-middle = pulseaudio-control next-node

######################################################

[module/brightness]
type = internal/backlight
card = ${system.sys_graphics_card}

enable-scroll = true
scroll-up = /home/robert/.config/bspwm/src/Brightness up
scroll-down = /home/robert/.config/bspwm/src/Brightness down
format = <ramp><label>
label = %percentage%%

ramp-0 = 󱩎
ramp-1 = 󱩐
ramp-2 = 󱩒
ramp-3 = 󱩔
ramp-4 = 󰛨
ramp-padding = 3pt
ramp-foreground = ${color.yellow}

######################################################

[module/battery]
type = internal/battery
full-at = 97
battery = ${system.sys_battery}
adapter = ${system.sys_adapter}
poll-interval = 2
time-format = %H:%M

format-charging = <animation-charging><label-charging>
format-charging-background = ${color.bg-alt}
label-charging = %percentage%%

format-discharging = <ramp-capacity><label-discharging>
format-discharging-background = ${color.bg-alt}
label-discharging = %percentage%%

format-full = <label-full>
format-full-background = ${color.bg-alt}
format-full-prefix = 
format-full-prefix-padding-right = 3pt
format-full-prefix-background = ${color.bg-alt}
format-full-prefix-font = 2
format-full-prefix-foreground = ${color.sky}
label-full = %percentage%%

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-foreground = ${color.sky}
ramp-capacity-font = 2
ramp-capacity-padding-right = 3pt

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-foreground = ${color.sky}
animation-charging-padding-right = 3pt
animation-charging-font = 2
animation-charging-framerate = 700

[module/notifybattery]
type = custom/script
exec = /home/robert/.config/bspwm/src/Notifybattery
interval = 90

######################################################

[module/temperature]
type = internal/temperature

hwmon-path = /sys/devices/platform/thinkpad_hwmon/hwmon/hwmon3/temp1_input

interval = 1
base-temperature = 20
warn-temperature = 70

ramp-0 = 
ramp-1 = 
ramp-2 = 
ramp-3 = 
ramp-4 = 
ramp-foreground = ${color.red}

format = <ramp> <label>
format-warn = <ramp> <label-warn>
label = %temperature-c%
label-warn-foreground = ${color.yellow}


######################################################

[module/bspwm]
type = internal/bspwm

enable-click = true
enable-scroll = true
reverse-scroll = true
pin-workspaces = true
occupied-scroll = false


format = <label-state>

label-focused =  󰮯
label-focused-padding = 1
label-focused-foreground = ${color.peach}

label-occupied = 󰊠
label-occupied-padding = 1
label-occupied-foreground= ${color.blue}

label-urgent = %icon%
label-urgent-padding = 1

label-empty = 󰑊
label-empty-foreground = ${color.overlay2}
label-empty-padding = 1

label-separator =
label-separator-padding = 0
label-separator-foreground = ${color.bg-alt}

######################################################

[module/updates]
type = custom/ipc

hook-0 = cat $HOME/.cache/Updates.txt 2>/dev/null
initial = 1

format = <label>
format-prefix = " "
format-prefix-foreground = ${color.green}

label = %output%

click-left = OpenApps --checkupdates
click-right = OpenApps --update

######################################################

[module/launcher]
type = custom/text

label = " "
label-foreground = ${color.blue}

click-left = OpenApps --menu
click-right = RiceSelector

[module/vscodium]
type = custom/text

label = ""
label-foreground = ${color.blue}

click-left = vscodium

[module/file_explorer]
type = custom/text

label = "󰉋 "
label-foreground = ${color.cyan}

click-left = thunar
click-right = dolphin

[module/firefox]
type = custom/text

label = "󰈹"
label-foreground = ${color.orange}

click-left = firefox

[module/terminal]
type = custom/text

label = ""
label-foreground = ${color.pink}

click-left = OpenApps --terminal
click-right = OpenApps --floating

#####################################################

[module/mplayer]
type = custom/text
label = "  "
label-foreground = ${color.green}

click-left = OpenApps --player
click-right = OpenApps --music

######################################################

[module/sep]
type = custom/text
label = " "
label-foreground = ${color.bg-alt}

######################################################

[module/cpu_bar]
type = internal/cpu

interval = 0.5

format = <label>
format-prefix = ""
format-prefix-padding = 3pt
format-prefix-foreground = ${color.maroon}
label = "%{A1:auto-cpufreq-gtk:}%percentage%%%{A1}"

######################################################

[module/memory_bar]
type = internal/memory

interval = 3

format = <label>
format-prefix = ""
format-prefix-padding = 3pt
format-prefix-foreground = ${color.peach}
label = "%used%"

######################################################

[module/mpd_control]
type            = internal/mpd
host            = 127.0.0.1
port            = 6600
interval        = 2

format-online   = <icon-prev><toggle><icon-next>
icon-play               = " %{T2} "
icon-pause              = " %{T2} "
icon-stop               = " %{T2} "
icon-prev               = "%{T2} "
icon-next               = " %{T2}"

icon-play-foreground    = ${color.lime}
icon-pause-foreground   = ${color.lime}
icon-stop-foreground    = ${color.lime}
icon-prev-foreground    = ${color.blue}
icon-next-foreground    = ${color.blue}

format-offline  = <label-offline>
format-offline-foreground = ${color.fg}
label-offline = " No Music"

[module/mpd]
type                    = internal/mpd
host                    = 127.0.0.1
port                    = 6600
interval        		= 2
format-online           = "%{F#9ece6a}[%{F-} <label-song> %{F#9ece6a}]%{F-}"
format-offline          = " No Music"
format-offline-foreground = ${color.fg}
label-song              = "%title% - %artist%"
label-song-maxlen		= 30
icon-repeat             = ""

toggle-on-foreground    = ${color.green}
toggle-off-foreground   = ${color.red}

[module/cava-left]
type = custom/script
exec = $HOME/.config/bspwm/rices/Thinkpad/cava/cava-left.sh
tail = true
format = <label>
label = %output%

[module/cava-right]
type = custom/script
exec = $HOME/.config/bspwm/rices/Thinkpad/cava/cava-right.sh
tail = true
format = <label>
label = %output%

######################################################

[module/dunst-history]
type = custom/text

content = "🔔"

; "click-(left|middle|right)" will be executed using "/usr/bin/env sh -c $COMMAND"
click-left = ~/.config/bspwm/src/Dunst-History display-history 10
click-middle = ~/.config/bspwm/src/Dunst-History display-history
click-right = ~/.config/bspwm/src/Dunst-History close-history &

######################################################

[module/r00t]
type = custom/text
label =  ""
label-foreground = ${color.cyan}

click-left = OpenApps --usercard

[module/power]
type = custom/text
label = ""
label-foreground = ${color.red}

click-left = OpenApps --powermenu

######################################################

[module/weather]
type = custom/script
exec = Weather wmodule
interval = 900
format = <label>
label = "%output%"
label-background= ${color.bg-alt}

######################################################

[module/tray]
type = internal/tray

format = <tray>
format-background = ${color.bg-alt}
tray-background = ${color.bg-alt}
tray-foreground = ${color.fg}
tray-spacing = 5px
tray-padding = 0px
tray-size = 40%

#####################################################

[module/bluetooth]
type = custom/script
exec = ~/.config/bspwm/src/bluetooth.sh
interval = 3
format = <label>
format-foreground = ${color.blue}
label = "%output%"
click-left = OpenApps --bluetooth
click-right = exec ~/.config/bspwm/src/toggle_bluetooth.sh

#####################################################

[module/xkeyboard]
type = internal/xkeyboard

blacklist-0 = num lock
blacklist-1 = scroll lock

format = <label-layout>
format-prefix = " "
format-prefix-font = 2
format-prefix-foreground = ${color.cyan}

label-layout = %{A1:OpenApps --keyboard:}%layout%%{A}

[module/fcitx]
type = custom/script
exec = ~/.config/bspwm/src/polybar-fcitx5-script.sh
tail = true
interval = 0
format-prefix = " "
format-foreground = ${color.text}
